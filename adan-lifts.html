<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adan Lifts</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --card: #181818;
    --border: #252525;
    --accent: #ff6a00;
    --accent-dim: rgba(255,106,0,0.10);
    --accent-bright: #ff8c38;
    --text: #f0f0f0;
    --muted: #5a5a5a;
    --muted2: #888;
    --done-bg: #141414;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding-bottom: 60px; }

  /* LOADING OVERLAY */
  #loadingOverlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  #loadingOverlay .logo { font-family: 'Bebas Neue', sans-serif; font-size: 40px; color: var(--accent); letter-spacing: 4px; }
  #loadingOverlay .sub { font-size: 12px; color: var(--muted2); text-transform: uppercase; letter-spacing: 2px; }
  .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* HEADER */
  .header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px; position: sticky; top: 0; z-index: 100;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .header-title { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 3px; color: var(--accent); line-height: 1; }
  .sync-row { display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .sync-dot.synced { background: #4ade80; }
  .sync-dot.syncing { background: var(--accent); animation: pulse 1s infinite; }
  .sync-dot.error { background: #f87171; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .sync-label { font-size: 10px; color: var(--muted2); letter-spacing: 1px; text-transform: uppercase; }

  /* WEEK NAV */
  .week-nav { display: flex; align-items: center; gap: 10px; }
  .week-btn {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border);
    background: none; color: var(--muted2); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    line-height: 1;
  }
  .week-btn:hover { border-color: var(--accent); color: var(--accent); }
  .week-label { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; color: var(--text); min-width: 70px; text-align: center; }
  .prog-pill { background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.5px; margin-left: auto; }

  /* TAB BAR */
  .tab-bar {
    display: flex; overflow-x: auto; gap: 6px;
    padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; background: none; border: 1px solid var(--border); color: var(--muted2);
    font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500;
    padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: all 0.2s;
    text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
  .tab:not(.active):hover { border-color: var(--accent); color: var(--accent); }

  /* PANELS */
  .day-panel { display: none; padding: 16px 16px 0; }
  .day-panel.active { display: block; }

  .day-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; color: var(--text); margin-bottom: 3px; }
  .day-focus { font-size: 11px; color: var(--muted2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }

  /* PROGRESS BAR */
  .prog-track { height: 2px; background: var(--border); border-radius: 2px; margin-bottom: 4px; }
  .prog-fill { height: 2px; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
  .prog-count { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 14px; }

  /* EXERCISE CARD */
  .ex-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 10px; overflow: hidden; transition: border-color 0.2s, opacity 0.2s;
  }
  .ex-card.done { opacity: 0.55; }
  .ex-card.done .ex-check { background: var(--accent); border-color: var(--accent); }
  .ex-card.done .ex-check svg { display: block; }

  .ex-header { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; user-select: none; }
  .ex-num { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--accent); width: 22px; flex-shrink: 0; line-height: 1; }
  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex-meta { font-size: 10px; color: var(--muted2); margin-top: 2px; }
  .ex-check {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .ex-check svg { display: none; }

  /* SETS BODY */
  .ex-body { padding: 0 14px 14px; }
  .reps-tag { display: inline-block; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 4px; font-size: 10px; color: var(--muted2); padding: 2px 7px; margin-bottom: 10px; }
  .sets-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .set-box { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .set-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .set-inp {
    width: 58px; height: 50px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 16px; font-weight: 600; text-align: center; outline: none; transition: all 0.2s;
    -moz-appearance: textfield;
  }
  .set-inp::-webkit-outer-spin-button, .set-inp::-webkit-inner-spin-button { -webkit-appearance: none; }
  .set-inp:focus { border-color: var(--accent); background: var(--accent-dim); }
  .set-inp.has-val { border-color: #2a2a2a; color: var(--accent); }
  .set-unit { font-size: 9px; color: var(--muted); }

  /* FINISH BTN */
  .finish-btn {
    width: 100%; margin-top: 12px; padding: 11px;
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted2); font-family: 'DM Sans', sans-serif; font-size: 12px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.2s;
  }
  .finish-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .ex-card.done .finish-btn { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  /* COMPLETE BANNER */
  .day-complete { display: none; margin-bottom: 16px; background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 12px; padding: 16px; text-align: center; }
  .day-complete.show { display: block; }
  .day-complete h3 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--accent); letter-spacing: 2px; margin-bottom: 4px; }
  .day-complete p { font-size: 12px; color: var(--muted2); }

  /* NOTES */
  .notes-area {
    width: 100%; margin-top: 14px; padding: 12px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 13px; resize: vertical;
    min-height: 70px; outline: none; transition: border-color 0.2s;
  }
  .notes-area::placeholder { color: var(--muted); }
  .notes-area:focus { border-color: var(--accent); }
  .autosave-note { font-size: 10px; color: var(--muted); text-align: center; margin-top: 8px; letter-spacing: 0.5px; }

  /* RECAP TAB */
  .recap-section { margin-bottom: 22px; }
  .section-label { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; color: var(--muted2); margin-bottom: 12px; }

  .recap-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .recap-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .rc-day { font-size: 10px; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
  .rc-name { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
  .rc-weight { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--accent); line-height: 1; }
  .rc-unit { font-size: 11px; color: var(--muted2); margin-left: 2px; }

  /* EXPORT BOX */
  .export-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
  .export-box-label { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .export-box-sub { font-size: 11px; color: var(--muted2); margin-bottom: 14px; }
  .export-btns { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 16px; border-radius: 8px; font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 600; letter-spacing: 0.5px; cursor: pointer;
    transition: all 0.2s; text-transform: uppercase; border: 1px solid transparent;
  }
  .btn-orange { background: var(--accent); color: #000; border-color: var(--accent); }
  .btn-orange:hover { background: var(--accent-bright); border-color: var(--accent-bright); }
  .btn-outline { background: none; border-color: var(--border); color: var(--muted2); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .flash { font-size: 11px; color: #4ade80; margin-top: 8px; display: none; }
  .flash.show { display: block; }

  /* AI BOX */
  .ai-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .ai-label { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; font-weight: 600; }
  .ai-content { font-size: 13px; line-height: 1.7; color: var(--text); }
  .ai-content p { margin-bottom: 10px; }
  .ai-content strong { color: var(--accent); font-weight: 600; }

  .dot-loader { display: inline-flex; gap: 4px; }
  .dot-loader span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  .dot-loader span:nth-child(2) { animation-delay: 0.2s; }
  .dot-loader span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,100%{opacity:0.2} 50%{opacity:1} }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="logo">ADAN LIFTS</div>
  <div class="spinner"></div>
  <div class="sub">Cargando datos...</div>
</div>

<div class="header">
  <div class="header-top">
    <div class="header-title">ADAN LIFTS</div>
    <div class="sync-row">
      <div class="sync-dot" id="syncDot"></div>
      <div class="sync-label" id="syncLabel">—</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="week-nav">
      <button class="week-btn" onclick="changeWeek(-1)">‹</button>
      <div class="week-label" id="weekLabel">SEMANA 1</div>
      <button class="week-btn" onclick="changeWeek(1)">›</button>
    </div>
    <div class="prog-pill" id="progPill">0 / 7</div>
  </div>
</div>

<div class="tab-bar" id="tabBar"></div>
<div id="panels"></div>

<script>
const PROGRAM = [
  {
    id:1, label:"D1 · EMPUJE", full:"Día 1 — Empuje", enfoque:"Pecho Primario · Hombros Secundario",
    ejercicios:[
      {nombre:"Press Inclinado con Barra", series:3, reps:"6–8"},
      {nombre:"Press con Mancuernas en Plano", series:3, reps:"8–10"},
      {nombre:"Aperturas en Polea (abajo→arriba)", series:3, reps:"12–15"},
      {nombre:"Press de Hombros con Mancuernas", series:3, reps:"8–10"},
      {nombre:"Elevaciones Laterales en Polea", series:3, reps:"15–20"},
      {nombre:"Extensión de Tríceps Sobre Cabeza", series:3, reps:"12–15"},
      {nombre:"Jalón de Tríceps en Polea (cuerda)", series:3, reps:"12–15"},
    ]
  },
  {
    id:2, label:"D2 · JALÓN", full:"Día 2 — Jalón", enfoque:"Espalda Primaria · Bíceps Secundario",
    ejercicios:[
      {nombre:"Dominadas con Peso", series:3, reps:"6–8"},
      {nombre:"Remo con Soporte de Pecho", series:3, reps:"8–10"},
      {nombre:"Remo en Polea Sentado (agarre ancho)", series:3, reps:"10–12"},
      {nombre:"Jalón al Pecho (agarre neutro)", series:3, reps:"10–12"},
      {nombre:"Face Pull con Cuerda", series:3, reps:"15–20"},
      {nombre:"Curl con Mancuerna Inclinado", series:3, reps:"10–12"},
      {nombre:"Curl Martillo", series:3, reps:"12–15"},
    ]
  },
  {
    id:3, label:"D3 · PIERNAS", full:"Día 3 — Piernas", enfoque:"Dominante de Cuádriceps",
    ejercicios:[
      {nombre:"Sentadilla con Barra", series:4, reps:"5–8"},
      {nombre:"Prensa de Piernas", series:3, reps:"10–12"},
      {nombre:"Hack Squat / Sentadilla Búlgara", series:3, reps:"10–12"},
      {nombre:"Extensión de Piernas", series:3, reps:"12–15"},
      {nombre:"Curl de Piernas Sentado", series:3, reps:"12–15"},
      {nombre:"Elevación de Pantorrillas de Pie", series:4, reps:"12–15"},
      {nombre:"Elevación de Tibial / Pantorrilla Sentado", series:3, reps:"15–20"},
    ]
  },
  {
    id:4, label:"D4 · HOMBROS", full:"Día 4 — Hombros", enfoque:"Hombros Dedicado · Tríceps",
    ejercicios:[
      {nombre:"Press Militar con Barra (de pie)", series:4, reps:"5–8"},
      {nombre:"Elevaciones Laterales con Mancuerna", series:4, reps:"15–20"},
      {nombre:"Elevación Lateral en Polea (cruzado)", series:3, reps:"15–20"},
      {nombre:"Aperturas Deltoides Posterior (polea)", series:3, reps:"15–20"},
      {nombre:"Remo al Mentón (barra EZ / polea)", series:3, reps:"12–15"},
      {nombre:"Press de Banca Agarre Cerrado", series:3, reps:"8–10"},
      {nombre:"Skull Crusher (barra EZ)", series:3, reps:"10–12"},
    ]
  },
  {
    id:5, label:"D5 · PIERNAS II", full:"Día 5 — Piernas II", enfoque:"Cadena Posterior · Isquiotibiales",
    ejercicios:[
      {nombre:"Peso Muerto Rumano", series:4, reps:"8–10"},
      {nombre:"Curl de Piernas Acostado", series:3, reps:"10–12"},
      {nombre:"Curl Nórdico / Curl en GHD", series:3, reps:"6–10"},
      {nombre:"Hip Thrust con Barra", series:3, reps:"10–12"},
      {nombre:"Estocadas Caminando (mancuernas)", series:3, reps:"10–12 c/pierna"},
      {nombre:"Extensión de Piernas (mantenimiento)", series:3, reps:"12–15"},
      {nombre:"Elevación de Pantorrillas Sentado", series:4, reps:"15–20"},
    ]
  },
  { id:6, label:"RESUMEN", full:"Resumen Semanal", enfoque:"", ejercicios:[] }
];

const API_KEY = '$2a$10$QR7R9tSqbovZw0xKejAUp.T.cXbKEAQTtpEl.pVh9GFMiN3G1at2y';
const BIN_ID  = '69d1390d856a682189fc6e69';

let currentWeek = 1;
let data = { semanas: {} };
let saveTimer = null;

// ── SYNC ──────────────────────────────────────────────────────────────
function setSync(state, label) {
  document.getElementById('syncDot').className = 'sync-dot ' + state;
  document.getElementById('syncLabel').textContent = label;
}

async function loadFromCloud() {
  setSync('syncing', 'CARGANDO...');
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    });
    const json = await res.json();
    data = json.record || { semanas: {} };
    localStorage.setItem('adanlifts_backup', JSON.stringify(data));
    setSync('synced', 'SINCRONIZADO');
  } catch(e) {
    setSync('error', 'SIN CONEXIÓN');
    const backup = localStorage.getItem('adanlifts_backup');
    if (backup) data = JSON.parse(backup);
  }
  document.getElementById('loadingOverlay').style.display = 'none';
  renderAll();
}

async function saveToCloud() {
  localStorage.setItem('adanlifts_backup', JSON.stringify(data));
  try {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
      body: JSON.stringify(data)
    });
    setSync('synced', 'GUARDADO ✓');
  } catch(e) {
    setSync('error', 'ERROR AL GUARDAR');
  }
}

function debouncedSave() {
  setSync('syncing', 'GUARDANDO...');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToCloud, 1500);
}

// ── DATA HELPERS ──────────────────────────────────────────────────────
function getWeight(w, d, ei, si) {
  return data?.semanas?.[`s${w}`]?.[`d${d}`]?.[`e${ei}`]?.[`s${si}`] || '';
}
function setWeight(w, d, ei, si, v) {
  if (!data.semanas) data.semanas = {};
  if (!data.semanas[`s${w}`]) data.semanas[`s${w}`] = {};
  if (!data.semanas[`s${w}`][`d${d}`]) data.semanas[`s${w}`][`d${d}`] = {};
  if (!data.semanas[`s${w}`][`d${d}`][`e${ei}`]) data.semanas[`s${w}`][`d${d}`][`e${ei}`] = {};
  data.semanas[`s${w}`][`d${d}`][`e${ei}`][`s${si}`] = v;
  debouncedSave();
}
function getDone(w, d, ei) { return data?.semanas?.[`s${w}`]?.[`d${d}`]?.[`done${ei}`] || false; }
function setDone(w, d, ei, v) {
  if (!data.semanas) data.semanas = {};
  if (!data.semanas[`s${w}`]) data.semanas[`s${w}`] = {};
  if (!data.semanas[`s${w}`][`d${d}`]) data.semanas[`s${w}`][`d${d}`] = {};
  data.semanas[`s${w}`][`d${d}`][`done${ei}`] = v;
  debouncedSave();
}
function getNotes(w, d) { return data?.semanas?.[`s${w}`]?.[`d${d}`]?.notas || ''; }
function setNotes(w, d, v) {
  if (!data.semanas) data.semanas = {};
  if (!data.semanas[`s${w}`]) data.semanas[`s${w}`] = {};
  if (!data.semanas[`s${w}`][`d${d}`]) data.semanas[`s${w}`][`d${d}`] = {};
  data.semanas[`s${w}`][`d${d}`].notas = v;
  debouncedSave();
}
function getAI(w) { return data?.semanas?.[`s${w}`]?.ai || ''; }
function setAI(w, v) {
  if (!data.semanas) data.semanas = {};
  if (!data.semanas[`s${w}`]) data.semanas[`s${w}`] = {};
  data.semanas[`s${w}`].ai = v;
  debouncedSave();
}

// ── WEEK NAV ──────────────────────────────────────────────────────────
function changeWeek(dir) {
  const n = currentWeek + dir;
  if (n < 1) return;
  currentWeek = n;
  document.getElementById('weekLabel').textContent = `SEMANA ${currentWeek}`;
  renderAll();
}

// ── TAB SWITCH ────────────────────────────────────────────────────────
function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.day-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  updateHeaderProgress(idx);
}

function updateHeaderProgress(tabIdx) {
  const day = PROGRAM[tabIdx];
  if (!day || day.id === 6) { document.getElementById('progPill').textContent = ''; return; }
  const done = day.ejercicios.filter((_, ei) => getDone(currentWeek, day.id, ei)).length;
  document.getElementById('progPill').textContent = `${done} / ${day.ejercicios.length}`;
}

// ── RENDER ────────────────────────────────────────────────────────────
function renderAll() {
  // Tab bar
  document.getElementById('tabBar').innerHTML = PROGRAM.map((d, i) =>
    `<button class="tab${i === 0 ? ' active' : ''}" onclick="switchTab(${i})">${d.label}</button>`
  ).join('');

  // Panels
  const container = document.getElementById('panels');
  container.innerHTML = '';
  PROGRAM.forEach((day, di) => {
    const panel = document.createElement('div');
    panel.className = 'day-panel' + (di === 0 ? ' active' : '');
    panel.id = `panel-${di}`;
    panel.innerHTML = day.id === 6 ? buildRecap() : buildDay(day, di);
    container.appendChild(panel);
  });

  // Wire inputs
  PROGRAM.forEach((day, di) => {
    if (day.id === 6) return;
    day.ejercicios.forEach((ex, ei) => {
      ex.series && Array.from({length: ex.series}).forEach((_, si) => {
        const inp = document.getElementById(`inp-${di}-${ei}-${si}`);
        if (!inp) return;
        const val = getWeight(currentWeek, day.id, ei, si);
        inp.value = val;
        if (val) inp.classList.add('has-val');
        inp.addEventListener('input', () => {
          setWeight(currentWeek, day.id, ei, si, inp.value);
          inp.classList.toggle('has-val', !!inp.value);
          updateDayProgress(di, day);
        });
      });
      const card = document.getElementById(`card-${di}-${ei}`);
      if (getDone(currentWeek, day.id, ei) && card) card.classList.add('done');
    });

    const notes = document.getElementById(`notes-${di}`);
    if (notes) {
      notes.value = getNotes(currentWeek, day.id);
      notes.addEventListener('input', () => setNotes(currentWeek, day.id, notes.value));
    }
    updateDayProgress(di, day);
    checkDayComplete(di, day);
  });

  updateHeaderProgress(0);
}

function buildDay(day, di) {
  const cards = day.ejercicios.map((ex, ei) => {
    const inputs = Array.from({length: ex.series}, (_, si) =>
      `<div class="set-box">
        <div class="set-lbl">S${si+1}</div>
        <input class="set-inp" id="inp-${di}-${ei}-${si}" type="number" inputmode="decimal" placeholder="—" min="0" step="2.5">
        <div class="set-unit">kg</div>
      </div>`
    ).join('');
    return `
      <div class="ex-card" id="card-${di}-${ei}">
        <div class="ex-header" onclick="toggleBody(${di},${ei})">
          <div class="ex-num">${ei+1}</div>
          <div class="ex-info">
            <div class="ex-name">${ex.nombre}</div>
            <div class="ex-meta">${ex.series} series · ${ex.reps} reps</div>
          </div>
          <div class="ex-check">
            <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
              <path d="M1 5L4.5 8.5L11 1" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div class="ex-body" id="body-${di}-${ei}">
          <div class="reps-tag">Objetivo: ${ex.reps} reps por serie</div>
          <div class="sets-row">${inputs}</div>
          <button class="finish-btn" id="fbtn-${di}-${ei}" onclick="toggleDone(${di},${ei},${day.id})">
            Finalizar y Guardar
          </button>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="day-title">${day.full}</div>
    <div class="day-focus">${day.enfoque}</div>
    <div class="day-complete" id="complete-${di}">
      <h3>¡DÍA COMPLETADO!</h3>
      <p>Buen trabajo, Adan. Descansa y vuelve mañana.</p>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog-${di}" style="width:0%"></div></div>
    <div class="prog-count" id="cnt-${di}">0 / ${day.ejercicios.length} ejercicios completados</div>
    ${cards}
    <textarea class="notes-area" id="notes-${di}" placeholder="Notas de la sesión — PRs, cambios, cómo se sintió..."></textarea>
    <div class="autosave-note">◈ SE GUARDA AUTOMÁTICAMENTE</div>
  `;
}

function buildRecap() {
  const savedAI = getAI(currentWeek);
  const cards = PROGRAM.filter(d => d.id !== 6).map(day =>
    day.ejercicios.map((ex, ei) => {
      // Show average/max weight across sets for recap
      const weights = Array.from({length: ex.series}, (_, si) => getWeight(currentWeek, day.id, ei, si)).filter(v => v && v !== '');
      const display = weights.length ? Math.max(...weights.map(Number)) : null;
      return `
        <div class="recap-card">
          <div class="rc-day">Día ${day.id}</div>
          <div class="rc-name">${ex.nombre}</div>
          <div class="rc-weight">${display !== null ? display : '—'}<span class="rc-unit">${display !== null ? ' kg' : ''}</span></div>
        </div>`;
    }).join('')
  ).join('');

  const aiSection = savedAI
    ? `<div class="ai-box"><div class="ai-label">◈ Análisis IA — Semana ${currentWeek}</div><div class="ai-content" id="aiContent">${savedAI}</div></div>`
    : `<div class="ai-box"><div class="ai-label">◈ Análisis IA</div><div class="ai-content" id="aiContent"><p style="color:var(--muted)">Presiona Generar para obtener notas de coaching de tu semana.</p></div></div>`;

  return `
    <div class="day-title">Semana ${currentWeek} — Resumen</div>
    <div class="day-focus" style="margin-bottom:20px;">Todos los días · Pesos máximos</div>

    <div class="recap-section">
      <div class="section-label">Pesos Registrados</div>
      <div class="recap-grid">${cards}</div>
    </div>

    <div class="recap-section">
      <div class="export-box">
        <div class="export-box-label">↑ Exportar Semana</div>
        <div class="export-box-sub">Copia tus datos y pégalos en Claude o ChatGPT para tu check-in semanal.</div>
        <div class="export-btns">
          <button class="btn btn-orange" onclick="exportWeek('claude')">⬆ Copiar para Claude</button>
          <button class="btn btn-outline" onclick="exportWeek('chatgpt')">⬆ Copiar para ChatGPT</button>
        </div>
        <div class="flash" id="copyFlash">✓ ¡Copiado! Pégalo en el chat.</div>
      </div>
    </div>

    <div class="recap-section">
      <div class="section-label">Análisis de Coaching IA</div>
      ${aiSection}
      <div style="margin-top:12px;">
        <button class="btn btn-outline" id="genBtn" onclick="generateRecap()">Generar Resumen Semana ${currentWeek}</button>
      </div>
    </div>
  `;
}

// ── INTERACTIONS ──────────────────────────────────────────────────────
function toggleBody(di, ei) {
  const body = document.getElementById(`body-${di}-${ei}`);
  body.style.display = body.style.display === 'none' ? '' : 'none';
}

function toggleDone(di, ei, dayId) {
  const isDone = getDone(currentWeek, dayId, ei);
  setDone(currentWeek, dayId, ei, !isDone);
  const card = document.getElementById(`card-${di}-${ei}`);
  const btn = document.getElementById(`fbtn-${di}-${ei}`);
  card.classList.toggle('done', !isDone);
  btn.textContent = !isDone ? '✓ Guardado' : 'Finalizar y Guardar';
  const day = PROGRAM[di];
  updateDayProgress(di, day);
  checkDayComplete(di, day);
  updateHeaderProgress(di);
}

function updateDayProgress(di, day) {
  const done = day.ejercicios.filter((_, ei) => getDone(currentWeek, day.id, ei)).length;
  const total = day.ejercicios.length;
  const pct = Math.round(done / total * 100);
  const bar = document.getElementById(`prog-${di}`);
  const cnt = document.getElementById(`cnt-${di}`);
  if (bar) bar.style.width = pct + '%';
  if (cnt) cnt.textContent = `${done} / ${total} ejercicios completados`;
}

function checkDayComplete(di, day) {
  const allDone = day.ejercicios.every((_, ei) => getDone(currentWeek, day.id, ei));
  const banner = document.getElementById(`complete-${di}`);
  if (banner) banner.classList.toggle('show', allDone);
}

// ── EXPORT ────────────────────────────────────────────────────────────
function exportWeek(target) {
  const intro = target === 'chatgpt'
    ? `ADAN LIFTS — SEMANA ${currentWeek} — DATOS DE ENTRENAMIENTO\nSoy Adan. Aquí están mis pesos de esta semana. Por favor analiza mi progreso.\n${'='.repeat(50)}\n\n`
    : `ADAN LIFTS — SEMANA ${currentWeek} — CHECK-IN\n${'='.repeat(50)}\n\n`;

  let text = intro;
  PROGRAM.filter(d => d.id !== 6).forEach(day => {
    text += `DÍA ${day.id} — ${day.full.toUpperCase()}\n`;
    day.ejercicios.forEach((ex, ei) => {
      const weights = Array.from({length: ex.series}, (_, si) => getWeight(currentWeek, day.id, ei, si));
      const display = weights.map((w, i) => w ? `S${i+1}:${w}kg` : `S${i+1}:—`).join(' ');
      text += `  ${ex.nombre} (${ex.series}×${ex.reps}): ${display}\n`;
    });
    const notes = getNotes(currentWeek, day.id);
    if (notes) text += `  Notas: ${notes}\n`;
    text += '\n';
  });

  if (currentWeek > 1) {
    text += `\nCOMPARACIÓN SEMANA ${currentWeek - 1} → ${currentWeek}\n`;
    PROGRAM.filter(d => d.id !== 6).forEach(day => {
      day.ejercicios.forEach((ex, ei) => {
        const currWeights = Array.from({length: ex.series}, (_, si) => getWeight(currentWeek, day.id, ei, si)).filter(Boolean).map(Number);
        const prevWeights = Array.from({length: ex.series}, (_, si) => getWeight(currentWeek - 1, day.id, ei, si)).filter(Boolean).map(Number);
        if (currWeights.length && prevWeights.length) {
          const curr = Math.max(...currWeights), prev = Math.max(...prevWeights);
          const diff = curr - prev;
          text += `  ${ex.nombre}: ${prev} → ${curr} kg (${diff >= 0 ? '+' : ''}${diff})\n`;
        }
      });
    });
    text += '\n';
  }

  text += target === 'chatgpt'
    ? `Mis objetivos: hombros y piernas (2 días de piernas por semana). Programa de 5 días estilo Jeff Nippard.`
    : `Objetivos: hombros y piernas fuertes. 5 días. Pega esto y di "check-in semanal".`;

  navigator.clipboard.writeText(text).then(() => {
    const el = document.getElementById('copyFlash');
    if (el) { el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 3000); }
  }).catch(() => prompt('Copia esto:', text));
}

// ── AI RECAP ──────────────────────────────────────────────────────────
async function generateRecap() {
  const btn = document.getElementById('genBtn');
  const content = document.getElementById('aiContent');
  btn.disabled = true;
  btn.innerHTML = '<span class="dot-loader"><span></span><span></span><span></span></span>';

  let prompt = `Eres un coach experto en hipertrofia y fuerza. Analiza el siguiente registro de entrenamiento semanal.\n\nObjetivos: hombros grandes, piernas fuertes (2 días de piernas por semana). Programa estilo Jeff Nippard, 5 días.\n\nSemana ${currentWeek}:\n\n`;

  PROGRAM.filter(d => d.id !== 6).forEach(day => {
    prompt += `DÍA ${day.id} (${day.full}):\n`;
    day.ejercicios.forEach((ex, ei) => {
      const weights = Array.from({length: ex.series}, (_, si) => getWeight(currentWeek, day.id, ei, si));
      const display = weights.map((w, i) => w ? `S${i+1}:${w}kg` : `S${i+1}:—`).join(' ');
      prompt += `  ${ex.nombre} (${ex.series}×${ex.reps}): ${display}\n`;
    });
    const n = getNotes(currentWeek, day.id);
    if (n) prompt += `  Notas: ${n}\n`;
    prompt += '\n';
  });

  if (currentWeek > 1) {
    prompt += `\nSemana anterior (${currentWeek - 1}):\n`;
    PROGRAM.filter(d => d.id !== 6).forEach(day => {
      day.ejercicios.forEach((ex, ei) => {
        const prev = Array.from({length: ex.series}, (_, si) => getWeight(currentWeek - 1, day.id, ei, si)).filter(Boolean);
        if (prev.length) prompt += `  ${ex.nombre}: max ${Math.max(...prev.map(Number))}kg\n`;
      });
    });
  }

  prompt += `\nResponde en español. Proporciona:\n1. <strong>Resumen</strong> — 2 oraciones\n2. <strong>Logros</strong> — 2-3 puntos específicos\n3. <strong>Objetivos Semana ${currentWeek + 1}</strong> — sugerencias de peso concretas\n4. <strong>Puntos de Atención</strong> — 1-2 ajustes\n\nSé directo y específico. Usa etiquetas HTML <p> y <strong> únicamente.`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const d = await res.json();
    const txt = d.content?.map(b => b.text || '').join('') || 'No se pudo generar.';
    content.innerHTML = txt;
    setAI(currentWeek, txt);
  } catch(e) {
    content.innerHTML = '<p style="color:var(--accent)">Error de conexión. Intenta de nuevo.</p>';
  }
  btn.disabled = false;
  btn.textContent = `Regenerar Semana ${currentWeek}`;
}

// ── INIT ──────────────────────────────────────────────────────────────
loadFromCloud();
</script>
