<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Entreno — Adan</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0f;--card:#17171b;--card2:#1f1f25;--line:#2a2a32;
  --lime:#c8ff00;--dim:#6b6b78;--dim2:#9a9aa8;--txt:#f2f2f5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;padding:0 0 40px;}

/* HEADER */
.top{padding:22px 20px 0;}
.title{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:1px;line-height:1;}
.title span{color:var(--lime);}
.sub{font-size:13px;color:var(--dim);margin-top:2px;}
.saved{font-size:12px;color:var(--dim);margin-top:10px;display:flex;align-items:center;gap:6px;}
.saved .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);}
.saved.ok .dot{background:var(--lime);}
.saved.ok{color:var(--lime);}

/* DAY PICKER */
.days{display:flex;gap:8px;overflow-x:auto;padding:20px;scrollbar-width:none;}
.days::-webkit-scrollbar{display:none;}
.day{flex-shrink:0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:12px 18px;cursor:pointer;text-align:center;min-width:76px;transition:.15s;}
.day .n{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;color:var(--dim2);}
.day .l{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.5px;}
.day.on{background:var(--lime);border-color:var(--lime);}
.day.on .n,.day.on .l{color:#000;}
.day.done .n{color:var(--lime);}

/* BODY */
.wrap{padding:0 20px;}
.dayname{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;margin-bottom:2px;}
.daysub{font-size:13px;color:var(--dim);margin-bottom:6px;}
.bar{height:5px;background:var(--card2);border-radius:99px;overflow:hidden;margin:14px 0 6px;}
.fill{height:100%;background:var(--lime);border-radius:99px;transition:width .3s;}
.count{font-size:12px;color:var(--dim);margin-bottom:20px;}

/* EXERCISE CARD */
.ex{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:.15s;}
.ex.filled{border-color:var(--lime);}
.exmain{flex:1;min-width:0;}
.exname{font-size:16px;font-weight:500;line-height:1.25;}
.exreps{font-size:12px;color:var(--dim);margin-top:3px;}
.exlast{font-size:12px;color:var(--dim);margin-top:3px;}
.exlast b{color:var(--dim2);font-weight:500;}
.wbox{display:flex;align-items:center;gap:2px;background:var(--card2);border:1.5px solid var(--line);
  border-radius:12px;padding:0 12px 0 4px;flex-shrink:0;transition:.15s;}
.ex.filled .wbox{border-color:var(--lime);background:#c8ff000d;}
.winp{background:none;border:none;color:var(--txt);font-family:'Bebas Neue',sans-serif;
  font-size:30px;width:74px;text-align:center;padding:12px 0;outline:none;
  -moz-appearance:textfield;letter-spacing:1px;}
.winp::-webkit-outer-spin-button,.winp::-webkit-inner-spin-button{-webkit-appearance:none;}
.winp::placeholder{color:var(--dim);}
.ex.filled .winp{color:var(--lime);}
.kg{font-size:12px;color:var(--dim);}

/* SUGGESTED STATE */
.ex.sug .wbox{border-color:var(--line);background:var(--card2);border-style:dashed;}
.ex.sug .winp{color:var(--dim);}
.ok{background:none;border:1.5px solid var(--line);border-radius:9px;color:var(--dim2);
  font-size:15px;padding:9px 11px;margin-left:8px;cursor:pointer;flex-shrink:0;line-height:1;}
.ex.sug .ok{border-color:var(--lime);color:var(--lime);}
.sugtag{font-size:11px;color:var(--dim);margin-top:3px;font-style:italic;}

/* WEEK NAV */
.wknav{display:flex;align-items:center;gap:14px;margin-top:12px;}
.wkbtn{background:var(--card);border:1.5px solid var(--line);border-radius:10px;color:var(--dim2);
  font-size:17px;width:34px;height:34px;cursor:pointer;line-height:1;}
.wkbtn:disabled{opacity:.3;}
.wklbl{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;}
.next{width:100%;margin-top:10px;background:var(--lime);border:none;border-radius:16px;color:#000;
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;padding:17px;cursor:pointer;}

/* NOTES + FINISH */
.notes{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  color:var(--txt);font-family:'DM Sans',sans-serif;font-size:15px;padding:16px 18px;
  resize:none;min-height:80px;margin-top:18px;outline:none;}
.notes:focus{border-color:var(--lime);}
.notes::placeholder{color:var(--dim);}
.fin{width:100%;margin-top:12px;background:none;border:1.5px solid var(--line);border-radius:16px;
  color:var(--dim2);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;
  padding:17px;cursor:pointer;transition:.15s;}
.fin.done{background:var(--lime);border-color:var(--lime);color:#000;}

/* LOADER */
.load{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;z-index:99;font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--lime);}
</style>
</head>
<body>
<div class="load" id="load">ENTRENO</div>

<div class="top">
  <div class="title">ENTRE<span>NO</span></div>
  <div class="wknav">
    <button class="wkbtn" id="wkprev" onclick="wk(-1)">‹</button>
    <div class="wklbl" id="cyc">SEMANA 1</div>
    <button class="wkbtn" id="wknext" onclick="wk(1)">›</button>
  </div>
  <div class="saved" id="save"><span class="dot"></span><span id="savetxt">Cargando</span></div>
</div>

<div class="days" id="days"></div>
<div class="wrap" id="body"></div>

<script>
const KEY='$2a$10$O7oW0lYtp956/on9QP2vn.QZyrXAPrVj/ubAanzM02gjSdb9Tu2NK';
const BIN='69d1392caaba882197c4a623';
const VER='simple-1';
let D={cycles:{}},cur=1,day=0,timer=null;

const P=[
 {id:'d1',n:'1',t:'PECHO',full:'PECHO + TRÍCEPS',ex:[
  ['Press Inclinado con Barra','6–8'],['Press de Banca','6–8'],
  ['Press de Pecho en Máquina','10–12'],['Aperturas en Polea','12–15'],
  ['Rompecráneos Barra EZ','10–12'],['Extensión Tríceps Polea Alta','12–15'],
  ['Jalón Tríceps con Cuerda','15–20'],['Cruce de Poleas','12–15']]},
 {id:'d2',n:'2',t:'ESPALDA',full:'ESPALDA + BÍCEPS',ex:[
  ['Remo en Banco Inclinado','8–10'],['Jalón al Pecho Ancho','10–12'],
  ['Jalón al Pecho un Brazo','10–12'],['Remo en Polea Cerrado','10–12'],
  ['Curl Bayesiano en Polea','10–12'],['Curl en Predicador','10–12'],
  ['Curl Martillo','12–15'],['Aperturas Posteriores','15–20']]},
 {id:'d3',n:'3',t:'HOMBRO',full:'HOMBROS + PIERNA (CUÁDRICEPS)',ex:[
  ['Press Arnold','8–10'],['Press Hombros en Máquina','8–10'],
  ['Elevación Lateral Inclinado','15–20'],['Elevación Lateral en Polea','15–20'],
  ['Remo al Mentón en Polea','12–15'],['Prensa de Piernas Pie Alto','10–12'],
  ['Extensión de Cuádriceps','15–20'],['Hack Squat','10–12']]},
 {id:'d4',n:'4',t:'PECHO/ESP',full:'PECHO + ESPALDA',ex:[
  ['Press Inclinado Mancuernas','8–10'],['Remo Meadows','10–12'],
  ['Press Inclinado en Máquina','10–12'],['Remo en Polea Cerrado','10–12'],
  ['Aperturas en Polea','12–15'],['Aperturas Posteriores','15–20'],
  ['Aperturas con Mancuernas','12–15'],['Elevación en Y con Polea','15–20']]},
 {id:'d5',n:'5',t:'BRAZOS',full:'BLAST DE BRAZOS',ex:[
  ['Curl Bayesiano en Polea','10–12'],['Extensión Tríceps Polea Alta','12–15'],
  ['Curl en Predicador','10–12'],['Rompecráneos Barra EZ','10–12'],
  ['Curl Martillo','12–15'],['Jalón Tríceps con Cuerda','15–20'],
  ['Curl Inclinado Mancuerna','10–12'],['Jalón Tríceps un Brazo','15–20']]},
 {id:'d6',n:'6',t:'PIERNA',full:'HOMBROS + PIERNA (GLÚTEOS)',ex:[
  ['Press Arnold','8–10'],['Press Hombros en Máquina','8–10'],
  ['Elevación Lateral Inclinado','15–20'],['Aperturas Posteriores','15–20'],
  ['Remo al Mentón en Polea','12–15'],['Hip Thrust','10–12'],
  ['Peso Muerto Rumano','8–10'],['Extensión de Cuádriceps','15–20']]}
];

// data
const C=c=>D.cycles[`c${c}`]||(D.cycles[`c${c}`]={});
const Dy=(c,d)=>{const x=C(c);return x[d]||(x[d]={w:{},done:false,note:''});};
const getW=(c,d,i)=>(D.cycles?.[`c${c}`]?.[d]?.w?.[i])||'';
const setW=(c,d,i,v)=>{Dy(c,d).w[i]=v;save();};
// walk back through weeks to find the last confirmed weight
function lastW(d,i){for(let c=cur-1;c>=1;c--){const v=getW(c,d,i);if(v)return v;}return '';}
function maxWk(){let m=1;Object.keys(D.cycles||{}).forEach(k=>{const n=+k.slice(1);if(n>m)m=n;});return m;}

function status(ok,txt){const e=document.getElementById('save');e.className='saved'+(ok?' ok':'');document.getElementById('savetxt').textContent=txt;}
function save(){clearTimeout(timer);timer=setTimeout(push,1200);}
async function push(){
  status(false,'Guardando');
  localStorage.setItem('adan_simple',JSON.stringify(D));
  try{await fetch(`https://api.jsonbin.io/v3/b/${BIN}`,{method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':KEY},body:JSON.stringify(D)});
    status(true,'Guardado');}catch(e){status(false,'Sin conexión');}
}
async function load(){
  if(localStorage.getItem('adan_simple_v')!==VER){
    localStorage.removeItem('adan_simple');
    localStorage.setItem('adan_simple_v',VER);
  }
  const c=localStorage.getItem('adan_simple');
  if(c){try{D=JSON.parse(c);if(!D.cycles)D.cycles={};}catch(e){D={cycles:{}};}
    document.getElementById('load').style.display='none';render();}
  try{
    const r=await fetch(`https://api.jsonbin.io/v3/b/${BIN}/latest`,{headers:{'X-Master-Key':KEY}});
    const j=await r.json();D=j.record?.cycles?j.record:{cycles:{}};
    localStorage.setItem('adan_simple',JSON.stringify(D));
    status(true,'Guardado');
  }catch(e){status(false,'Sin conexión');}
  document.getElementById('load').style.display='none';
  openLatest();render();
}
function openLatest(){
  for(let i=P.length-1;i>=0;i--){
    const d=P[i];const has=d.ex.some((_,j)=>getW(cur,d.id,j));
    if(has){day=(D.cycles?.[`c${cur}`]?.[d.id]?.done && i<P.length-1)?i+1:i;return;}
  }
  day=0;
}

function wk(dir){
  const n=cur+dir;if(n<1)return;
  cur=n;openLatest();render();window.scrollTo({top:0});
}
function render(){
  document.getElementById('cyc').textContent='SEMANA '+cur;
  document.getElementById('wkprev').disabled=cur<=1;
  document.getElementById('days').innerHTML=P.map((d,i)=>{
    const done=D.cycles?.[`c${cur}`]?.[d.id]?.done;
    return`<div class="day${i===day?' on':''}${done?' done':''}" onclick="go(${i})">
      <div class="n">${d.n}</div><div class="l">${d.t}</div></div>`;}).join('');
  const d=P[day];
  const done=D.cycles?.[`c${cur}`]?.[d.id]?.done;
  const note=D.cycles?.[`c${cur}`]?.[d.id]?.note||'';
  let n=0;d.ex.forEach((_,i)=>{if(getW(cur,d.id,i))n++;});
  document.getElementById('body').innerHTML=`
    <div class="dayname">DÍA ${d.n}</div>
    <div class="daysub">${d.full}</div>
    <div class="bar"><div class="fill" style="width:${n/d.ex.length*100}%"></div></div>
    <div class="count">${n} de ${d.ex.length} hechos</div>
    ${d.ex.map((e,i)=>{
      const w=getW(cur,d.id,i);const lw=lastW(d.id,i);
      const sug=!w&&lw;                     // carried forward, not yet confirmed
      const val=w||lw;
      return`<div class="ex${w?' filled':''}${sug?' sug':''}" id="ex${i}">
        <div class="exmain">
          <div class="exname">${e[0]}</div>
          <div class="exreps">${e[1]} reps · 4 series</div>
          ${sug?`<div class="sugtag">Sugerido de la semana pasada</div>`
               :lw?`<div class="exlast">Anterior: <b>${lw} kg</b></div>`:''}
        </div>
        <div class="wbox">
          <input class="winp" type="number" inputmode="decimal" step="2.5" placeholder="—"
            value="${val}" oninput="w(${i},this.value)">
          <span class="kg">kg</span>
        </div>
        ${sug?`<button class="ok" onclick="ok(${i},'${lw}')">✓</button>`:''}
      </div>`;}).join('')}
    <textarea class="notes" placeholder="Notas de hoy…" oninput="nt(this.value)">${note}</textarea>
    <button class="fin${done?' done':''}" onclick="fin()">${done?'✓ Sesión terminada':'Terminar sesión'}</button>
    ${allDone()&&cur===maxWk()?`<button class="next" onclick="newWk()">Empezar Semana ${cur+1} →</button>`:''}`;
}
function allDone(){return P.every(d=>D.cycles?.[`c${cur}`]?.[d.id]?.done);}
function ok(i,v){w(i,v);render();}
function newWk(){cur=maxWk()+1;C(cur);day=0;save();render();window.scrollTo({top:0});}
function go(i){day=i;render();window.scrollTo({top:0,behavior:'smooth'});}
function w(i,v){
  const d=P[day];setW(cur,d.id,i,v);
  const row=document.getElementById('ex'+i);
  row.className='ex'+(v?' filled':'');
  if(v){ // committed — drop the confirm button and the "sugerido" label
    const b=row.querySelector('.ok');if(b)b.remove();
    const t=row.querySelector('.sugtag');if(t)t.remove();
  }
  let n=0;d.ex.forEach((_,j)=>{if(getW(cur,d.id,j))n++;});
  document.querySelector('.fill').style.width=(n/d.ex.length*100)+'%';
  document.querySelector('.count').textContent=`${n} de ${d.ex.length} hechos`;
}
function nt(v){Dy(cur,P[day].id).note=v;save();}
function fin(){const d=Dy(cur,P[day].id);d.done=!d.done;save();render();}
load();
</script>
</body>
</html>
